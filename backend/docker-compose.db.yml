version: '3.8'

services:
  caresync-postgres:
    image: postgres:16-alpine
    container_name: caresync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: caresync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caresync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
